<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nikhil Weds Tanishka &mdash; Wedding Invite</title>
  <meta name="description" content="You're invited &mdash; Saturday, 12th December 2026, Lucknow. Tap to open the invitation." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#FCF8EF" />

  <!-- Link previews (WhatsApp / iMessage / Instagram) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Nikhil Weds Tanishka &mdash; Wedding Invite" />
  <meta property="og:description" content="You're invited &mdash; Saturday, 12th December 2026, Lucknow. Tap to open the invitation." />
  <meta property="og:url" content="https://nkhll.github.io/NikhilWedsTanishka/" />
  <meta property="og:image" content="https://nkhll.github.io/NikhilWedsTanishka/preview.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Nikhil Weds Tanishka - Saturday, 12th December 2026, Lucknow" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E" />

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 22px;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      background: #FCF8EF;
      color: #152A47;
    }
    main { max-width: 24rem; }
    .eyebrow {
      margin: 0 0 18px;
      color: #C7A76A;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 400;
      line-height: 1.15;
      color: #152A47;
    }
    h1 .weds { font-style: italic; color: #C7A76A; }
    .when {
      margin: 0 0 30px;
      color: #6E7A88;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      padding: 15px 30px;
      border-radius: 999px;
      background: #152A47;
      color: #fff;
      text-decoration: none;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(21, 42, 71, 0.18);
    }
    .btn:active { filter: brightness(1.1); }
    .tiny {
      margin: 22px 0 0;
      color: #A7ADB4;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      line-height: 1.5;
    }
  </style>

  <!-- The invite URL lives in config.js. The href below is only a fallback. -->
  <script src="config.js"></script>
  <script>
    (function () {
      function go() {
        var link = document.getElementById("open");
        var configured = window.WEDDING && window.WEDDING.inviteUrl;
        var url = configured || link.getAttribute("href");

        if (!url || url === "#") {
          document.getElementById("when").textContent = "The invitation link is not set up yet.";
          document.getElementById("hint").style.display = "none";
          link.style.display = "none";
          return;
        }

        link.href = url;

        // Short delay so the button paints first: if a browser blocks the
        // automatic jump (WhatsApp / Instagram in-app browsers), guests
        // still have something to tap.
        setTimeout(function () { window.location.replace(url); }, 150);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", go);
      } else {
        go();
      }
    })();
  </script>
</head>
<body>
  <main>
    <p class="eyebrow">Jai Shree Mataji</p>
    <h1>Nikhil <span class="weds">Weds</span> Tanishka</h1>
    <p class="when" id="when">Saturday, 12th December 2026 &middot; Lucknow</p>
    <a class="btn" id="open" href="https://www.meta.ai/share/a/0a080251-86d4-43b1-bc64-c92d8649c6ef/" rel="noopener">Tap to Open</a>
    <p class="tiny" id="hint">If nothing happens, tap the button above.</p>
    <noscript><p class="tiny">Please tap &ldquo;Tap to Open&rdquo; above.</p></noscript>
  </main>
</body>
</html>
